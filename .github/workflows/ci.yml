# Manual run only: lint, tests and the example. Never on push (the repository owner's cost rule).
name: ci
on:
  workflow_dispatch: {}
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "pydantic>=2" ruff pytest
      - run: ruff check . && ruff format --check .
      - run: python -m pytest -q
      - run: python examples/route_one.py
      - run: python -m router options
